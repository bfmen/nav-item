<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060d1f"/>
      <stop offset="48%" stop-color="#0d1b3e"/>
      <stop offset="100%" stop-color="#071226"/>
    </linearGradient>
    <radialGradient id="orbBlue" cx="22%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#1d4ed8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#060d1f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbIndigo" cx="80%" cy="76%" r="52%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.38"/>
      <stop offset="52%" stop-color="#312e81" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#060d1f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCyan" cx="74%" cy="18%" r="36%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#060d1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planeA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="planeB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#93c5fd" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgBase)"/>
  <rect width="1920" height="1080" fill="url(#orbBlue)"/>
  <rect width="1920" height="1080" fill="url(#orbIndigo)"/>
  <rect width="1920" height="1080" fill="url(#orbCyan)"/>

  <!-- 极简几何折面 -->
  <polygon points="0,0 920,0 520,1080 0,1080" fill="url(#planeA)"/>
  <polygon points="1160,0 1920,0 1920,1080 760,1080" fill="url(#planeB)"/>
  <polygon points="420,1080 1280,180 1920,660 1920,1080" fill="#1e293b" opacity="0.28"/>
  <polygon points="0,720 680,320 1180,1080 0,1080" fill="#0f172a" opacity="0.34"/>

  <!-- 精密微光线条与几何圆环 -->
  <g fill="none" stroke="url(#lineGlow)" stroke-width="1.5">
    <line x1="520" y1="1080" x2="920" y2="0"/>
    <line x1="760" y1="1080" x2="1160" y2="0"/>
    <line x1="120" y1="840" x2="1800" y2="210" opacity="0.65"/>
  </g>
  <g fill="none" stroke="#93c5fd" stroke-opacity="0.12">
    <circle cx="960" cy="540" r="320" stroke-width="1.2"/>
    <circle cx="960" cy="540" r="520" stroke-width="1"/>
    <circle cx="1520" cy="240" r="190" stroke-width="1.2"/>
  </g>
</svg>
