<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040814"/>
      <stop offset="45%" stop-color="#09192f"/>
      <stop offset="80%" stop-color="#102542"/>
      <stop offset="100%" stop-color="#091324"/>
    </linearGradient>
    <linearGradient id="auroraGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="30%" stop-color="#34d399" stop-opacity="0.58"/>
      <stop offset="62%" stop-color="#38bdf8" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="auroraPurple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="42%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="76%" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <filter id="auroraBlur" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <linearGradient id="peakBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c3557"/>
      <stop offset="100%" stop-color="#0a1528"/>
    </linearGradient>
    <linearGradient id="peakFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#11223d"/>
      <stop offset="100%" stop-color="#050b16"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#nightSky)"/>

  <!-- 极光光带 -->
  <g filter="url(#auroraBlur)">
    <path d="M-120 420 Q340 160 760 280 T1580 180 T2040 310 L2040 520 Q1520 350 1020 440 T-120 560 Z" fill="url(#auroraGreen)"/>
    <path d="M120 260 Q640 80 1120 220 T1980 110 L1980 340 Q1380 260 880 360 T120 410 Z" fill="url(#auroraPurple)"/>
  </g>

  <!-- 繁星 -->
  <g fill="#f8fafc">
    <circle cx="140" cy="110" r="1.8" opacity="0.8"/>
    <circle cx="290" cy="185" r="1.4" opacity="0.65"/>
    <circle cx="465" cy="95" r="2.1" opacity="0.9"/>
    <circle cx="620" cy="160" r="1.3" opacity="0.6"/>
    <circle cx="845" cy="82" r="1.9" opacity="0.85"/>
    <circle cx="1030" cy="140" r="1.5" opacity="0.7"/>
    <circle cx="1220" cy="76" r="2.2" opacity="0.88"/>
    <circle cx="1410" cy="175" r="1.4" opacity="0.65"/>
    <circle cx="1595" cy="102" r="2" opacity="0.82"/>
    <circle cx="1790" cy="150" r="1.6" opacity="0.72"/>
    <circle cx="1680" cy="245" r="1.3" opacity="0.55"/>
    <circle cx="380" cy="280" r="1.4" opacity="0.6"/>
  </g>

  <!-- 远景雪山 -->
  <polygon points="0,840 240,610 470,770 760,540 1050,750 1340,565 1620,760 1920,620 1920,1080 0,1080" fill="url(#peakBack)"/>
  <!-- 山脊微雪高光 -->
  <g fill="#bae6fd" opacity="0.16">
    <polygon points="760,540 825,602 775,612 740,590"/>
    <polygon points="1340,565 1400,620 1352,630 1318,610"/>
    <polygon points="240,610 292,662 252,670 220,650"/>
  </g>

  <!-- 近景山峰与静湖 -->
  <polygon points="0,885 330,720 620,860 940,715 1290,875 1640,705 1920,840 1920,1080 0,1080" fill="url(#peakFront)"/>
  <rect x="0" y="920" width="1920" height="160" fill="#050b16" opacity="0.82"/>
  <ellipse cx="960" cy="985" rx="680" ry="38" fill="#2dd4bf" opacity="0.09"/>
</svg>
